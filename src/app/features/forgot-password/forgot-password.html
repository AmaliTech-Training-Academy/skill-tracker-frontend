<div class="onboarding-login">
  <h1>Forgot Password?</h1>
  <p>No worries! We'll help you reset it.</p>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
    <app-input-field
      label="Email"
      type="email"
      id="email"
      placeholder="Email"
      [control]="getControl(forgotPasswordForm, 'email')"
    ></app-input-field>

    <button
      class="login-button"
      type="submit"
      [disabled]="forgotPasswordForm.invalid || (loading$ | async)"
    >
      @if (loading$ | async) {
        Sending Link...
      } @else {
        Send Link
      }
    </button>
  </form>

  <div class="resend-and-retry">
    <a [routerLink]="['/login']">Back to Login</a> or
    <button (click)="tryDifferentEmail()">Try a different email</button>
  </div>
</div>
