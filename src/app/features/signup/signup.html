<div class="signup-page">
  <main class="signup-container">
    <div class="card">
      <div class="card-header-text">
        <h1 class="card-title">Create Your Free Account</h1>
        <p class="card-subtitle">
          Join thousands of learners leveling up their skills with personalized challenges and
          real-time feedback
        </p>
      </div>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
        <app-input-field
          label="Email"
          type="email"
          id="email"
          placeholder="Email"
          [control]="getFormControl(signupForm, 'email')"
        >
        </app-input-field>

        <app-input-field
          label="Password"
          type="password"
          id="password"
          placeholder="***********"
          [control]="getFormControl(signupForm, 'password')"
          [passwordRequirements]="passwordRequirements()"
          [showPasswordRequirements]="true"
        >
        </app-input-field>

        <app-input-field
          label="Confirm Password"
          type="password"
          id="confirmPassword"
          placeholder="***********"
          [control]="getFormControl(signupForm, 'confirmPassword')"
          [formHasPasswordMismatch]="signupForm.hasError('passwordsMismatch')"
        >
        </app-input-field>

        <button type="submit" class="btn-primary" [disabled]="isSubmitting() || signupForm.invalid">
          @if (isSubmitting()) {
            <span class="loader"></span> Signing Up...
          } @else {
            Create Account
          }
        </button>
      </form>

      <div class="footer">
        <div class="divider">
          <span class="divider-text"
            >Already have an account?
            <button type="button" class="link" (click)="goToLogin()">Login</button></span
          >
        </div>
        <div class="or-divider">or</div>
        <div class="button-wrapper">
          <button class="btn-social google" (click)="signInWithGoogle()">
            <img src="assets/google-icon.png" alt="Google logo" class="social-icon" />
            <span>Sign in with Google</span>
          </button>
          <button class="btn-social github" (click)="signInWithGithub()">
            <img src="assets/github-icon.png" alt="Github logo" class="social-icon" />
            <span>Sign in with GitHub</span>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
