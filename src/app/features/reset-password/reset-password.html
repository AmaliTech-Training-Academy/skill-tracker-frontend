<div class="signup-page">
    <main class="signup-container">
        <div class="card">
            <div class="card-header-text">
                <h1 class="card-title">Reset Your Password</h1>
                <p class="card-subtitle">
                    Enter a new password below to secure your account.
                </p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="resetpassword()" class="signup-form">
               
                
                <app-input-field
                    label="New Password"
                    type="password"
                    id="password"
                    placeholder="***********"
                    [control]="getFormControl(loginForm,'password')"
                    [passwordRequirements]="passwordRequirements()"
                    [showPasswordRequirements]="true">
                </app-input-field>

               
                <app-input-field
                    label="Confirm New Password"
                    type="password"
                    id="confirmPassword"
                    placeholder="***********"
                    [control]="getFormControl(loginForm,'confirmPassword')"
                    [formHasPasswordMismatch]="hasPasswordMismatch">
                </app-input-field>

                
                <button type="submit" class="btn-primary" [disabled]="isSubmitting() || loginForm.invalid">
                    @if (isSubmitting()) {
                    <span class="loader"></span> Resetting Password...
                    } @else {
                    Reset Password
                    }
                </button>
            </form>

        </div>
    </main>
</div>
