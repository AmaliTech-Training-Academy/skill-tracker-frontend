<div class="onboarding-login">
  <h1>Reset Your Password</h1>
  <p>Enter a new password below to secure your account.</p>

  <form [formGroup]="loginForm" (ngSubmit)="resetpassword()" novalidate>
    <!-- New Password -->
    <app-input-field
      label="New Password"
      type="password"
      id="password1"
      placeholder="***********"
      [control]="currentPasswordControl"
    ></app-input-field>

    <!-- Password Strength Indicators (Uses component getters which rely on the passwordValue signal) -->
    <ul class="password-strength">
      <li [class.valid]="hasUppercase">
        <fa-icon [icon]="hasUppercase ? faCheck : faTimes"></fa-icon>
        1 uppercase
      </li>
      <li [class.valid]="hasLowercase">
        <fa-icon [icon]="hasLowercase ? faCheck : faTimes"></fa-icon>
        1 lowercase
      </li>
      <li [class.valid]="hasNumber">
        <fa-icon [icon]="hasNumber ? faCheck : faTimes"></fa-icon>
        1 number
      </li>
      <li [class.valid]="hasSpecialChar">
        <fa-icon [icon]="hasSpecialChar ? faCheck : faTimes"></fa-icon>
        1 special character (e.g. !&#64;#$%^&*)
      </li>
    </ul>

    <!-- Confirm Password -->
    <app-input-field
      label="Confirm Password"
      type="password"
      id="password2"
      placeholder="***********"
      [control]="newPasswordControl"
    ></app-input-field>

    <!-- Update button text and disable state for Ngrx submission -->
    <button
      type="submit"
      class="login-button"
      [disabled]="loginForm.invalid || isSubmitting()"
    >
      @if (!isSubmitting()) {
        <span>Reset Password</span>
      } @else {
        <span>Loading...</span>
      }
    </button>
  </form>
</div>
