<section class="features-section">
    <!-- Features Header -->
    <header class="section-header">
        <h2 class="section-title">Ready to advance your technical skills?</h2>
        <p class="section-subtitle">
            That's where SkillDev comes in. We combine AI-powered practice with personalized
            feedback to help you master the skills that matter most.
        </p>
    </header>

    <!-- Cards Grid -->
    <div class="features-grid">
        @for(feat of features; track feat.title) {
        <app-feature-card [title]="feat.title" [description]="feat.description" [icon]="feat.icon"/>
        }
    </div>
</section>
