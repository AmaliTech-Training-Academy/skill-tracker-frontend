<section class="lumina-callout" role="banner" aria-labelledby="lumina-title" id="how-it-works">
  <div class="callout-inner">
    <div class="content-wrapper">
      <h2 id="lumina-title" class="callout-title">{{ title }}</h2>
      <p class="callout-description">{{ description }}</p>
    </div>
    <img [src]="robotImageSrc" [alt]="robotImageAlt" class="robot-image" loading="lazy" />
  </div>
</section>
