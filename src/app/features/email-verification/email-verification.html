<div class="verification-container">
  <div class="card">
    <div class="header">
      <h1 class="title">Verify Your Email</h1>
      <p class="subtitle">
        We've sent a 6-digit code to [your@email.com].<br />
        Please enter it below to confirm your email address.
      </p>
    </div>

    <form [formGroup]="otpForm" class="otp-form" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <input maxlength="1" formControlName="otp1" (input)="onInput($event, otp2)" (keydown)="onKeyDown($event)" #otp1 />
        <input maxlength="1" formControlName="otp2" (input)="onInput($event, otp3)" (keydown)="onKeyDown($event, otp1)" #otp2 />
        <input maxlength="1" formControlName="otp3" (input)="onInput($event, otp4)" (keydown)="onKeyDown($event, otp2)" #otp3 />
        <input maxlength="1" formControlName="otp4" (input)="onInput($event, otp5)" (keydown)="onKeyDown($event, otp3)" #otp4 />
        <input maxlength="1" formControlName="otp5" (input)="onInput($event, otp6)" (keydown)="onKeyDown($event, otp4)" #otp5 />
        <input maxlength="1" formControlName="otp6" (input)="onInput($event)" (keydown)="onKeyDown($event, otp5)" #otp6 />
      </div>

      <div class="actions">
        <p class="resend-info">
          Didn't get the code?
          <button type="button" class="resend-link">Resend Code </button>
          <span class="timer"> in 00:30</span>
        </p>
        <p class="edit-email">
          Entered the wrong email? <a class="link" routerLink="/signup">Go Back</a>
        </p>
      </div>

      <button class="btn-primary" type="submit" [disabled]="!formValid() || isSubmitting()">
          @if(isSubmitting()){
            <span class="spinner"></span> Verifying...
          } @else {
            Verify Email
          }
      </button>
    </form>
  </div>
</div>
