
  <section class="interest">
    <div class="interest-container">
      

      <header>
        <h1>Choose up to 5 interests to personalize your experience</h1>
        <p>
         Please select up to 5 skills to showcase in your profile. You can add more later if interested
        </p>
      </header>
      <div class="interest-selection">
     @for (badge of badges; track badge.id) {
     
    <app-interests-chip
      [label]="badge.label"
      [icon]="badge.icon"
      [selected]="selectedBadges.includes(badge.id)"
      (chipSelect)="toggleBadge(badge.id)"
    />
  }
      </div>

      <div class="interest-btns">
        <button class="interest-btns--skip" >Skip</button>
        <button class="interest-btns--next" >Next</button>
      </div>
    </div>
  </section>
