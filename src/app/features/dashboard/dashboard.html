<app-dashboard-header-component [username]="getUserName()" />

<div class="dashboard-container">
  @if (isDashboardAnalyticsLoading()) {
    <app-stats-card-skeleton />
  } @else if (isDashboardAnalyticsError(); as err) {
    <app-dashboard-error-component
      [title]="'Could not load Dashboard Analytics data'"
      [message]="err.message"
      (onRetry)="ngOnInit()"
    />
  } @else {
    <app-dashboard-stats-container
      [userStats]="userStats()"
      [skillsInProgressCount]="skillsInProgressCount()"
    />
  }
  <main class="dashboard-content">
    <app-dashboard-recommended-tasks
      [recommendations]="recommendedTasks()"
      [isRecommendedTasksLoading]="isRecommendedTasksLoading()"
      [recommendedTasksError]="selectRecommendedTasksError()"
    />
    <app-dashboard-progress-overview-component
      [primarySkillProgress]="primarySkillProgress()"
      [progressChartData]="data.progressChartData.weekly"
      [selectedPeriod]="selectedPeriod()"
      [isDashboardAnalyticsError]="isDashboardAnalyticsError()"
      [isDashboardAnalyticsLoading]="isDashboardAnalyticsLoading()"
      (selectPeriod)="selectPeriod($event)"
    />
  </main>
</div>
