<header class="dashboard-header">
  <h1>Welcome, Aba 👋</h1>
  <p>Track your progress and continue developing your skill</p>
</header>
<section class="stats-grid">
  <app-stat-card title="Current Streak" [value]="4 + ' days'" [iconName]="'flame'" />
  <app-stat-card title="Task Completed" [value]="2" iconName="clipboard-check" />
  <app-stat-card title="Skills In Progress" [value]="1" iconName="brain-circuit" />
</section>
<main class="dashboard-content">
  <section class="recommended-tasks">
    <div class="section-header">
      <h2>Recommended Tasks</h2>
      <app-custom-dropdown [options]="['HTML', 'CSS', 'JavaScript']" selectedValue="HTML" />
    </div>
    <div class="tasks-list">
      <app-tasks-card
        [task]="{
          id: 't1',
          title: 'Fix The Print Statement',
          icon: 'abc',
          description: 'Assess your knowledge in this skill area.',
          skill: 'HTML',
          difficulty: 'Beginner',
          xp: 0,
          time: '15 min',
          status: 'Pending',
        }"
      />
      <app-tasks-card
        [task]="{
          id: 't2',
          title: 'Concept Explanation',
          icon: 'pencil',
          description: 'Explain a key concept in your own words.',
          skill: 'Data Structures',
          difficulty: 'Beginner',
          xp: 0,
          time: '15 min',
          status: 'Pending',
        }"
      />
    </div>
  </section>
  <section class="progress-overview">
    <div class="section-header">
      <div>
        <h2>Your Progress</h2>
        <span>Level 1</span>
      </div>

      <div class="filters">
        <app-custom-dropdown [options]="['HTML', 'CSS', 'JavaScript']" selectedValue="HTML" />

        <div class="period-filter">
          <button [class.active]="selectedPeriod() === 'weekly'" (click)="selectPeriod('weekly')">
            Weekly
          </button>
          <button [class.active]="selectedPeriod() === 'monthly'" (click)="selectPeriod('monthly')">
            Monthly
          </button>
          <button [class.active]="selectedPeriod() === 'yearly'" (click)="selectPeriod('yearly')">
            Yearly
          </button>

          <app-custom-dropdown [options]="['Weekly', 'Monthly', 'Yearly']" selectedValue="Weekly" />
        </div>
      </div>
    </div>

    @if (primarySkillProgress; as firstSkill) {
      <app-progress-bar
        [currentXp]="firstSkill.currentXp"
        [totalXp]="firstSkill.currentLevelTotalXp"
        [levelName]="firstSkill.nextLevel"
      ></app-progress-bar>
    }

    <app-progress-chart [data]="data.progressChartData.weekly" />
  </section>
</main>
