<div class="onboarding-login">

  <h1>Welcome Back 👋</h1>
  <p>Sign in to continue your personalized learning journey</p>

  <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
    <app-input-field
      label="Email"
      type="email"
      id="email"
      placeholder="Email"
      [control]="getFormControl(loginForm, 'email')"
    ></app-input-field>

    <app-input-field
      label="Password"
      type="password"
      id="password"
      placeholder="***********"
      [control]="getFormControl(loginForm, 'password')"
    ></app-input-field>

    <a routerLink="/forgot-password">Forgot Password?</a>

    <button class="login-button" type="submit" [disabled]="loginForm.invalid || isLoggingIn()">
      {{ isLoggingIn() ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <p class="login-donthave-account">
    Don't have an account? <a routerLink="/signup">Sign Up</a>
  </p>

  <p class="login-or">or</p>

  <div class="login-other--login">
    <button type="button" class="google-login">
      <img src="assets/google-icon.png" alt="google logo" />
      <p class="login-alternative--text">Sign in with Google</p>
    </button>

    <button type="button" class="facebook-login">
      <img src="assets/github-icon.png" alt="apple logo" />
      <p class="login-alternative--text">Sign in with Github</p>
    </button>
  </div>
</div>
