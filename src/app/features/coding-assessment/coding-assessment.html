<main class="assessment-container" aria-label="Coding Assessment">
  @switch (viewState()) {
    @case ('loading') {
      <div class="loading-container" role="status" aria-live="polite">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p class="loading-text">Loading task...</p>
      </div>
    }
    @case ('description') {
      @if (currentTask(); as task) {
        <section class="mobile-description-view" aria-label="Task Description">
          <app-challenge-description [task]="task" (startTask)="onStartTask()" />
        </section>
      }
    }
    @case ('coding') {
      @if (currentTask(); as task) {
        <section class="mobile-coding-workspace" aria-label="Coding Environment">
          <app-coding-editor
            class="mobile-editor"
            [task]="task"
            [userCode]="userCode()"
            (codeChanged)="onCodeChanged($event)"
          />
          <app-output-console
            class="mobile-console"
            [taskId]="task.id"
            [userCode]="userCode()"
            [output]="executionResult()"
            [testCases]="testResults()"
            (runCode)="onRunCode()"
            (submitTask)="onSubmitTask()"
          />
        </section>
      }
    }
  }

  @if (currentTask(); as task) {
    <section class="desktop-workspace" aria-label="Coding Workspace">
      <div class="desktop-top-row">
        <app-challenge-description
          class="desktop-description"
          [task]="task"
          (startTask)="onStartTask()"
        />
        <app-coding-editor
          class="desktop-editor"
          [task]="task"
          [userCode]="userCode()"
          (codeChanged)="onCodeChanged($event)"
          (runCode)="onRunCode()"
        />
      </div>
      <app-output-console
        class="desktop-console"
        [taskId]="task.id"
        [userCode]="userCode()"
        [output]="executionResult()"
        [testCases]="testResults()"
        (submitTask)="onSubmitTask()"
      />
    </section>
  }
</main>
