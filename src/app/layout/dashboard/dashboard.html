<main class="dashboard-layout">
  <app-dashboard-sidebar
    [isOpen]="isSidebarOpen()"
    [menuItems]="menuItems"
    [footerItems]="footerItems"
    (navigated)="onNavigate()"
  />
  @if (isSidebarOpen()) {
    <button class="sidebar-overlay" (click)="onNavigate()" aria-label="Close sidebar"></button>
  }
  <section class="main-content">
    <app-dashboard-navigation (toggleSidebar)="toggleSidebar()" [isSidebarOpen]="isSidebarOpen()" />
    <router-outlet />
  </section>
</main>
