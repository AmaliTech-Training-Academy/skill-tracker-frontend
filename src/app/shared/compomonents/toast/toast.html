@if (show$ | async) {
<div class="toast-container" [class.toast-exit]="exiting$ | async">
    @if (config$ | async; as config) {
    <div class="toast" [ngClass]="'toast-' + config.type">
        <div class="alert-icon">
            @if (config.type === toastType.SUCCESS) {
                <img src="assets/alert-check.png" alt="success">
            } @else if (config.type === toastType.ERROR) {
                <img src="assets/alert-error.png" alt="error">
            } @else if (config.type === toastType.INFO) {
                <img src="assets/alert-info.png" alt="info">
            } @else if (config.type === toastType.WARNING) {
                <img src="assets/alert-warning.png" alt="warning">
            }
        </div>
        <div class="alert-content">
            <div class="alert-header">
                <div class="alert-title">{{ config.title }}</div>
                <button type="button" class="alert-close" (click)="onClose()" (keydown.enter)="onClose()" (keydown.space)="onClose()" aria-label="Close notification">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.5 1.5L1.5 10.5M10.5 10.5L1.5 1.5" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
            <div class="alert-message">{{ config.message }}</div>
        </div>
    </div>
    }
</div>
}
