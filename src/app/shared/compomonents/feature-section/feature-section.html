<section class="features-section">
    <header class="section-header">
        <h2 class="section-title">{{ title() }}</h2>
        <p class="section-subtitle">{{ subtitle() }}</p>
    </header>
    <div class="features-grid" [class.skill-development]="type() === 'skill-development'">
        @for(item of items(); track item.title) {
            <app-feature-card [title]="item.title" [description]="item.description" [icon]="item.icon"/>
        }
    </div>
</section>
