<div class="skill-card">
  <div class="skill-header">
    <img [src]="skillIcon" [alt]="skillLabel" class="icon" />
    <span class="label">{{ skillLabel }}</span>
  </div>

  <div class="levels">
    @for (level of levels; track level.name) {
      <button
        class="level-chip"
        [class.selected]="selectedLevel === level.name"
        [attr.data-level]="level.name.toLowerCase()"
        (click)="selectLevel(level.name)"
      >
        {{ level.name }}
      </button>
    }
  </div>
</div>
