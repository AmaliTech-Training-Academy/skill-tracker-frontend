<div class="modal-overlay">
  <div class="modal-content">
    <div class="image-wrapper">
      <img src="assets/alert-error.png" alt="Error" class="error-image" />
    </div>

    <h2 class="modal-title">Submission Failed</h2>

    <p class="modal-message">
      {{ errorMessage() }}<br />
      Please try again or return to the dashboard.
    </p>

    <div class="actions">
      <button class="try-again-button" (click)="tryAgain.emit()">Try Again</button>

      <button class="dashboard-button" (click)="backToDashboard.emit()">Back to Dashboard</button>
    </div>
  </div>
</div>
