<div class="chart-container">
  <ngx-charts-line-chart
    [results]="chartData"
    [scheme]="customColors"
    [xAxis]="showXAxis"
    [yAxis]="showYAxis"
    [showGridLines]="showGridLines"
    [xAxisLabel]="xAxisLabel"
    [yAxisLabel]="yAxisLabel"
    [legend]="legend"
    [animations]="animations"
    [gradient]="gradient"
    [tooltipDisabled]="tooltipDisabled"
    [roundDomains]="true"
    [autoScale]="true"
    [curve]="curve"
    [showYAxisLabel]="showYAxisLabel"
  />
</div>
