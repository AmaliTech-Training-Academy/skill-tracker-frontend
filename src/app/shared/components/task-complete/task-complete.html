<div class="modal-overlay">
  <div class="modal-content">
    <div class="image-wrapper">
      <img [src]="robotImage" [alt]="robotAlt()" class="robot-image" />
    </div>

    <h2 class="modal-title">{{ title() }}</h2>

    @if (showLoadingSpinner()) {
      <div class="loading-spinner"></div>
    }

    @if (xpEarned() > 0) {
      <div class="xp-reward">+{{ xpEarned() }} XP</div>
    }

    <p class="modal-message">
      {{ getDefaultMessage() }}
    </p>

    <div class="actions">
      <button class="continue-button" (click)="continue.emit()">
        <span class="button-text">{{ buttonText() }}</span>
      </button>

      @if (showSecondaryButton()) {
        <button class="secondary-button" (click)="secondary.emit()">
          <span class="button-text">{{ secondaryButtonText() }}</span>
        </button>
      }
    </div>
  </div>
</div>
