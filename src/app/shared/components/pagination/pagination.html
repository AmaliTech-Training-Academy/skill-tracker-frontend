@if (paginationData().totalPages > 1) {
  <div class="pagination-container">
    <div class="pagination-wrapper">
      <button class="pagination-btn prev-btn" [disabled]="!canGoPrevious()" (click)="onPrevious()">
        <img src="assets/previous.png" alt="Previous button" />
      </button>

      @for (page of pageNumbers(); track page) {
        @if (page === '...') {
          <span class="pagination-ellipsis">...</span>
        } @else {
          <button
            class="pagination-btn page-btn"
            [class.active]="page === paginationData().currentPage"
            (click)="onPageClick(page)"
          >
            {{ page }}
          </button>
        }
      }

      <button class="pagination-btn next-btn" [disabled]="!canGoNext()" (click)="onNext()">
        <img src="assets/next.png" alt="Next button" />
      </button>
    </div>
  </div>
}
